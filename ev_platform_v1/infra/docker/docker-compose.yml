version: "3.8"

services:
  # ---------- INFRA ----------
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks: [ev-network]
    profiles: [infra, all]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password}
    networks: [ev-network]
    profiles: [infra, all]

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [ev-network]
    profiles: [infra, all]

  grafana:
    image: grafana/grafana
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: none
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on: [prometheus]
    networks: [ev-network]
    profiles: [infra, all]

  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [ev-network]
    profiles: [infra, all]

  # ---------- BACKEND ----------
  ocpp-server:
    build:
      context: ../../
      dockerfile: apps/ocpp-server/Dockerfile
    ports:
      - "9220:9220"
    environment:
      OCPP_PORT: 9220
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks: [ev-network]
    profiles: [backend, all]

  user-api:
    build:
      context: ../../
      dockerfile: apps/user-api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      USER_API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-ev-platform-secret-key}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks: [ev-network]
    profiles: [backend, all]

  admin-api:
    build:
      context: ../../
      dockerfile: apps/admin-api/Dockerfile
    ports:
      - "3002:3002"
    environment:
      ADMIN_API_PORT: 3002
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks: [ev-network]
    profiles: [backend, all]

  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      GATEWAY_PORT: 3000
      REDIS_URL: ${REDIS_URL}
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:3002}
      USER_API_URL: ${USER_API_URL:-http://user-api:3001}
    depends_on:
      - ocpp-server
      - user-api
      - admin-api
    networks: [ev-network]
    profiles: [backend, all]

  # ---------- FRONTEND ----------
  admin-web:
    build:
      context: ../../frontend/admin-web
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL:-http://localhost:3000}
        VITE_APP_GRAFANA_URL: ${VITE_APP_GRAFANA_URL:-http://localhost:3003}
        BUILD_COMMAND: ${WEB_BUILD_COMMAND:-build}
    ports:
      - "3004:80"
    depends_on: [api-gateway]
    networks: [ev-network]
    profiles: [frontend, all]

  # ---------- SIMULATION ----------
  charger-sim:
    build:
      context: ../../charger
      dockerfile: Dockerfile
    environment:
      OCPP_SERVER_URL: ws://64.227.181.90:9220
    profiles: [simulation, all]

networks:
  ev-network:
    driver: bridge
